name: sql_studio
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  flutter_launcher_icons: ^0.14.4
  fluttertoast: ^9.0.0
  go_router: ^16.3.0
  google_nav_bar: ^5.0.7
  highlight: ^0.7.0
  logger: ^2.6.2
  package_info_plus: ^9.0.0
  path: ^1.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sql/schemas/
    - assets/sql/seeds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/sql_studio_icon.png"
  min_sdk_android: 21
