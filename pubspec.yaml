name: sql_studio
description: "Practice SQL on your phone with local, editable, fully offline SQLite databases."
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  cross_file: ^0.3.5
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fluttertoast: ^9.0.0
  go_router: ^17.3.0
  google_nav_bar: ^5.0.7
  highlight: ^0.7.0
  intl: ^0.20.2
  logger: ^2.6.2
  package_info_plus: ^10.2.1
  path: ^1.9.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/sql/schemas/
    - assets/sql/seeds/
