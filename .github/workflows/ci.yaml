name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Fail if gen-l10n changed anything
        run: |
          if ! git diff --quiet -- lib/l10n; then
            echo "gen-l10n changed generated output. Commit the regenerated files." >&2
            git diff --stat -- lib/l10n >&2
            exit 1
          fi

      - name: Check ARB key parity
        run: ./scripts/check_l10n.sh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: ./scripts/check_coverage.sh coverage/lcov.info 91

      # Reporting only: check_coverage.sh above is what fails the build. A
      # fork's pull request cannot read the token, so an upload failure
      # must not fail the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          name: sql_studio
          fail_ci_if_error: false

  build_apk:
    name: Build release APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      # android/app/build.gradle.kts falls back to the debug keystore when
      # key.properties is absent (as it is here), so this exercises R8
      # shrinking without needing a signing secret.
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: sql_studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  integration:
    name: Integration tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      # A cold Android build resolves the Gradle/AGP toolchain and compiles
      # sqflite's native bindings. That alone can outrun a per-suite
      # timeout below, so it happens here rather than inside the emulator
      # session.
      - name: Warm the Android build
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Each suite gets a cold process: force-stop between them so one
      # suite's state (an active database, a created record) never leaks
      # into the next.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          script: |
            timeout 480 flutter test integration_test/first_run_test.dart -d emulator-5554
            adb -s emulator-5554 shell am force-stop br.com.dariomatias.sql_studio
            timeout 480 flutter test integration_test/create_database_query_test.dart -d emulator-5554
            adb -s emulator-5554 shell am force-stop br.com.dariomatias.sql_studio
            timeout 480 flutter test integration_test/edit_default_database_persists_test.dart -d emulator-5554
            adb -s emulator-5554 shell am force-stop br.com.dariomatias.sql_studio
            timeout 480 flutter test integration_test/reset_default_database_test.dart -d emulator-5554
            adb -s emulator-5554 shell am force-stop br.com.dariomatias.sql_studio
            timeout 480 flutter test integration_test/delete_database_test.dart -d emulator-5554
            adb -s emulator-5554 shell am force-stop br.com.dariomatias.sql_studio
            timeout 480 flutter test integration_test/locale_switch_test.dart -d emulator-5554

  osv-scanner:
    name: Scan dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on its own, not gated on or gating the other jobs: a newly
    # disclosed advisory with no fix available yet is not a reason to stop
    # the tests from reporting. Report only until there is a triage process.
    steps:
      - uses: actions/checkout@v7

      # Reads pubspec.lock against the OSV database, which carries pub
      # advisories. The lockfile is what matters: the caret ranges in
      # pubspec.yaml say what could resolve, not what actually ships.
      - name: Scan the lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock
