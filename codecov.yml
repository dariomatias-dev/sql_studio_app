# Codecov configuration.
#
# Coverage uploads as two independent flags, one per package, since the two
# suites run as separate CI jobs with different thresholds. The targets mirror
# their scripts/check_coverage.sh calls, which stay the authority: Codecov
# reports and annotates, the scripts are what actually fail the build.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "70...100"
  status:
    project:
      default: false
      app:
        flags: [app]
        target: 91%
        threshold: 0.5%
      app_ui:
        flags: [app_ui]
        target: 79%
        threshold: 0.5%
    patch:
      default:
        target: auto
        threshold: 0.5%

ignore:
  - "lib/l10n/**"

flags:
  app:
    paths:
      - lib/
    carryforward: true
  app_ui:
    paths:
      - packages/app_ui/lib/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true

github_checks:
  annotations: true
